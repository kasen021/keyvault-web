<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Vault</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0a0a0f;--surface:#111118;--card:#16161f;--border:#2a2a3a;--accent:#6c63ff;--text:#e8e8f0;--muted:#7a7a9a;--free:#22c55e;--danger:#ef4444}
body{background:var(--dark);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.logo{font-size:1.5rem;font-weight:700;margin-bottom:.25rem;text-align:center}
.logo span{color:var(--accent)}
.tagline{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:2rem}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;width:100%;max-width:380px}
.tabs{display:flex;gap:.5rem;margin-bottom:1.25rem}
.tab{flex:1;padding:.4rem;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);font-size:.8rem;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:.72rem;color:var(--muted);display:block;margin-bottom:.25rem}
input{background:#1a1a28;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.5rem .75rem;font-size:.82rem;width:100%;margin-bottom:.75rem;outline:none}
input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:.5rem;font-size:.82rem;font-weight:600;cursor:pointer;width:100%;margin-top:.25rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:.5rem}
.msg{font-size:.75rem;padding:.5rem .75rem;border-radius:6px;margin-top:.75rem;display:none}
.msg.success{background:#052e1640;color:var(--free);border:1px solid #22c55e30;display:block}
.msg.error{background:#2e051540;color:var(--danger);border:1px solid #ef444430;display:block}
.key-box{background:#0a0a14;border:1px solid var(--border);border-radius:6px;padding:.6rem;margin-top:.6rem;font-size:.68rem;font-family:monospace;word-break:break-all;color:var(--muted)}
.addr{font-size:.85rem;font-weight:600;color:var(--accent);word-break:break-all;margin:.4rem 0}
.warn{font-size:.72rem;color:#f59e0b;margin-top:.5rem;line-height:1.5}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="logo">Key <span>Vault</span></div>
<div class="tagline">Your encrypted identity. Your private keys.</div>

<div class="box">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('register')">Register</button>
    <button class="tab" onclick="switchTab('login')">Login</button>
  </div>

  <div id="tab-register">
    <label>Password (min. 8 characters)</label>
    <input type="password" id="reg-pass" placeholder="Create a strong password">
    <label>Confirm Password</label>
    <input type="password" id="reg-pass2" placeholder="Repeat your password">
    <button class="btn" onclick="register()">Create Key Vault Address</button>
    <div class="msg" id="reg-msg"></div>
    <div id="reg-result" style="display:none">
      <div style="font-size:.72rem;color:var(--muted);margin-top:.75rem">Your Address:</div>
      <div class="addr" id="reg-address"></div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:.5rem">Public Key:</div>
      <div class="key-box" id="reg-pubkey"></div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:.5rem">Private Key:</div>
      <div class="key-box" id="reg-privkey"></div>
      <div class="warn">⚠ Download your keys now. Private Key is NOT stored on server. Losing it means losing access to all encrypted data.</div>
      <button class="btn" style="margin-top:.75rem;background:#22c55e" onclick="downloadKeys()">⬇ Download Keys (.jsonl)</button>
      <button class="btn btn-outline" onclick="goToVault()">Enter Key Vault →</button>
    </div>
  </div>

  <div id="tab-login" style="display:none">
    <label>Your Address</label>
    <input type="text" id="login-addr" placeholder="KV1...">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="Your password">
    <label>Private Key (paste here)</label>
    <textarea id="login-privkey" style="background:#1a1a28;border:1px solid var(--border);border-radius:6px;color:var(--text);padding:.5rem .75rem;font-size:.72rem;width:100%;height:80px;margin-bottom:.75rem;outline:none;font-family:monospace;resize:none" placeholder="-----BEGIN PRIVATE KEY-----..."></textarea>
    <button class="btn" onclick="login()">Login</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<script>
let regData = null;

function switchTab(t) {
  document.getElementById('tab-register').style.display = t === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').style.display = t === 'login' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (t === 'register' && i === 0) || (t === 'login' && i === 1)));
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

async function register() {
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  if (pass.length < 8) return showMsg('reg-msg', 'Password minimum 8 characters.', 'error');
  if (pass !== pass2) return showMsg('reg-msg', 'Passwords do not match.', 'error');
  const btn = event.target;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Generating keys...';
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'register', password: pass })
    });
    const d = await res.json();
    if (!d.success) return showMsg('reg-msg', d.error, 'error');
    regData = d;
    document.getElementById('reg-address').textContent = d.address;
    document.getElementById('reg-pubkey').textContent = d.publicKey;
    document.getElementById('reg-privkey').textContent = d.privateKey;
    document.getElementById('reg-result').style.display = 'block';
    document.getElementById('reg-msg').style.display = 'none';
  } catch(e) {
    showMsg('reg-msg', 'Failed to connect to server.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Create Key Vault Address';
}

function downloadKeys() {
  if (!regData) return;
  const data = {
    address: regData.address,
    publicKey: regData.publicKey,
    privateKey: regData.privateKey,
    createdAt: new Date().toISOString(),
    warning: 'Keep this file safe. Never share your Private Key.'
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'keyvault-' + regData.address.slice(0, 10) + '.jsonl';
  a.click();
}

function goToVault() {
  if (!regData) return;
  sessionStorage.setItem('kv_address', regData.address);
  sessionStorage.setItem('kv_pubkey', regData.publicKey);
  window.location.href = '/vault';
}

async function login() {
  const address = document.getElementById('login-addr').value.trim();
  const password = document.getElementById('login-pass').value;
  const privateKey = document.getElementById('login-privkey').value.trim();
  if (!address || !password || !privateKey) return showMsg('login-msg', 'Fill all fields.', 'error');
  const btn = event.target;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verifying...';
  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', address, password, privateKey })
    });
    const d = await res.json();
    if (!d.success) return showMsg('login-msg', d.error, 'error');
    sessionStorage.setItem('kv_address', d.address);
    sessionStorage.setItem('kv_pubkey', d.publicKey);
    sessionStorage.setItem('kv_session', d.sessionToken);
    window.location.href = '/vault';
  } catch(e) {
    showMsg('login-msg', 'Failed to connect to server.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Login';
}
</script>
</body>
</html>
