name = "keyvault-web"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"

[[r2_buckets]]
binding = "PERSONAL_VAULT"
bucket_name = "keyvault-personal-vault"

[[durable_objects.bindings]]
name = "METRICS"
class_name = "Metrics"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Metrics"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReplayGuard"]
