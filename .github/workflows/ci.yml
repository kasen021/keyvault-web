name: Key Vault CI

on:
  push:
    branches:
      - main
      - hashor-file-integrity
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check core.js
      - run: node --check worker.js
      - run: node --check public/app.js
      - run: for file in api/*.js; do node --check "$file"; done
      - run: npm test
